[project]
name = "firm-aptesting"
version = "0.1.0"
description = "ActivityPub Test Suite for firm"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Steve Bate", email = "svc-github@stevebate.net"},
]
dependencies = [
    "activitypub-testsuite",
    "firm",
    "pytest-httpx>=0.30.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.26.0",
]

[tool.uv.sources]
activitypub-testsuite = { path = "../activitypub-testsuite", editable = true }
firm = { path = "../firm", editable = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firm_aptesting"]


[tool.pytest.ini_options]
# Tests are symlinked into ./tests from the installed `activitypub_testsuite`
# package. They must live inside the workspace: the VS Code pytest plugin
# builds its test tree from the workspace root, and silently refuses to run
# tests whose paths fall outside it (it logs "Session path not a parent of
# test paths" and the tests never execute). Do not point testpaths at
# `activitypub_testsuite.tests` — that path is outside the workspace.
testpaths = ["tests"]
markers = [
    "ap_reqlevel: ActivityPub requirements level",
    "ap_capability: ActivityPub/AS2 capability required for test",
]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'asyncio.get_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning:pytest_asyncio.plugin",
]
